name: hemoforge-app
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8501:8501"
    environment:
      HEMOBOT_OLLAMA_URL: ${HEMOBOT_OLLAMA_URL:-http://127.0.0.1:11434}
      HEMOBOT_OLLAMA_TOKEN_FILE: /run/secrets/ollama_token
      HEMOBOT_RAG_ENABLED: "false"
    secrets: [ollama_token]
    volumes:
      - audit-data:/app/data
      - ../knowledge/corpus:/app/knowledge/corpus:ro
    read_only: true
    tmpfs: [/tmp:size=64m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 4g
    cpus: 2
    pids_limit: 256
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 20s
      timeout: 10s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  streamlit:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      app: {condition: service_healthy}
    network_mode: service:app
    environment:
      HEMOFORGE_WEBSITE_URL: http://127.0.0.1:8000/#data
    command: [python, -m, streamlit, run, streamlit_app.py, --server.address=0.0.0.0, --server.port=8501, --server.headless=true, --browser.gatherUsageStats=false, --server.maxUploadSize=2]
    read_only: true
    tmpfs: [/tmp:size=64m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 1
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
volumes:
  audit-data:
secrets:
  ollama_token:
    file: ./secrets/ollama_token.txt
